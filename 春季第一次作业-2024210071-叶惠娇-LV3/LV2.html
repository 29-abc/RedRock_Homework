<body>
  <script>
    const add10 = (x) => x + 10;
    const mul10 = (x) => x * 10;
    const add100 = (x) => x + 100;

    // (10 + 100) * 10 + 10 = 1110

    function compose(fn1, fn2, fn3) {
      return function (x) {
        let arr = [fn3, fn2, fn1]
        let result = arr.reduce((add, fn) => fn(add), x)
        console.log(result)
      }
    }

    compose(add10, mul10, add100)(10);
  </script>
</body>
